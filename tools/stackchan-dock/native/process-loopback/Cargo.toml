[package]
name = "stackchan-process-loopback"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Capture one Windows process tree and forward 24 kHz mono PCM to StackChan Dock"

[dependencies]
opus = "0.3.1"
wasapi = "0.23.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Variant", "Win32_System_WinRT"] }
