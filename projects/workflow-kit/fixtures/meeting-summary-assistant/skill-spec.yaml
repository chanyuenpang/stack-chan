fixtureId: meeting-summary-assistant
fixtureVersion: 0.1.0
kind: skill-spec
skill:
  name: meeting-summary-assistant
  version: 0.1.0
  title: 会议纪要整理助手
  description: 根据公开或虚构会议记录生成结构化中文会议纪要。
  triggerPhrases:
    - 整理会议纪要
    - 生成会议总结
    - 提炼会议结论
    - 提取会议待办
inputs:
  required:
    - meetingTranscript
  optional:
    - meetingTitle
    - attendeeNames
    - outputLanguage
outputs:
  primary: structuredMeetingSummary
  format: markdown
  requiredSections:
    - 会议概览
    - 关键结论
    - 待办事项
    - 风险与阻塞
    - 后续建议
boundaries:
  allowed:
    - 总结用户直接提供的公开或虚构文本
    - 在信息不足时标注“未提供”
    - 保留不确定性，不编造参会人或结论
  denied:
    - 访问网络补全会议背景
    - 外发纪要
    - 写入文件
    - 执行删除、覆盖或系统配置修改
    - 读取私有路径或凭证
checklist:
  structure: 定义输入、输出、边界和触发词。
  trigger: 中文触发词覆盖会议纪要、总结、结论、待办。
  boundary: 保守权限边界明确。
  dependency: 无外部依赖。
  replay: 可使用静态 replay cases 验证触发与拒绝行为。
  privacy: 禁止真实敏感数据与私有路径。
  compatibility: 版本为 0.1.0，适配静态 MVP。
